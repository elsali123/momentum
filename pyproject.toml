[project]
name = "robot-ingest"
version = "0.1.0"
description = "Normalize and ingest customer robot-learning datasets (RH20T, DROID) into one canonical schema."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=14",              # PyAV: decode source AV1, encode canonical H.264 (bundles its own FFmpeg)
    "duckdb>=1.1",         # catalog / query layer over the Parquet tables
    "fastapi>=0.115",      # viewer API
    "huggingface_hub>=0.26",
    "numpy>=1.26",
    "pillow>=10",
    "pyarrow>=17",
    "pytz>=2024.1",        # DuckDB needs it to return timezone-aware timestamps (episodes.ingested_at) to Python
    "scipy>=1.11",
    "uvicorn>=0.30",
]

[project.scripts]
robot-ingest = "robot_ingest.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.pylint.format]
max-line-length = 130
